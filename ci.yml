schemaVersion: v0.4
prepare:
  steps:
    - name: Install the server's own dependencies
      command: python3 -m pip install --user --break-system-packages -r requirements.txt || python3 -m pip install --user -r requirements.txt
    - name: Install yt-dlp + the yt-dlp-ejs challenge solver (same interpreter)
      command: python3 -m pip install --user --break-system-packages -U yt-dlp yt-dlp-ejs || python3 -m pip install --user -U yt-dlp yt-dlp-ejs
    - name: Fetch the Discogs dump (skipped once the index exists)
      command: test -f data/samples.db || tools/fetch_dump.sh
    - name: Build the sample index (skipped once it exists)
      command: test -f data/samples.db || python3 tools/build_db.py data/discogs_*_releases.xml.gz -o data/samples.db
    - name: Drop the dump, keep the index
      command: test -f data/samples.db && rm -f data/discogs_*_releases.xml.gz || true
    - name: Install ffmpeg via Nix (mp3 conversion for downloads)
      command: command -v ffmpeg >/dev/null 2>&1 || nix-env -iA nixpkgs.ffmpeg || (nix-channel --update && nix-env -iA nixpkgs.ffmpeg) || true
    - name: Install deno via Nix (JS runtime for YouTube's sig/n challenge)
      command: command -v deno >/dev/null 2>&1 || nix-env -iA nixpkgs.deno || (nix-channel --update && nix-env -iA nixpkgs.deno) || true
test:
  steps:
    - name: Syntax-check the server
      command: python3 -m py_compile server.py db.py
    - name: Verify the server and its database layer import
      command: python3 -c "import server, db; print('server + db import OK')"
    - name: Verify yt-dlp can see the solver and a JS runtime
      command: python3 -c "import yt_dlp, yt_dlp_ejs, shutil, sys, os; assert shutil.which('deno') or os.path.exists(os.path.expanduser('~/.nix-profile/bin/deno')), 'no JS runtime (deno) found'; print('yt-dlp', yt_dlp.version.__version__, '+ solver + deno OK in', sys.executable)"
    - name: Verify ffmpeg is available (mp3 conversion)
      command: PATH="$HOME/.nix-profile/bin:$PATH" ffmpeg -version > /dev/null && echo "ffmpeg OK"
run:
  sample-casino:
    healthEndpoint: http://localhost:3000/health
    plan: 201
    replicas: 1
    network:
      ports:
        - port: 3000
          isPublic: false
      paths:
        - port: 3000
          path: /
    env:
      PORT: 3000
      HOST: 0.0.0.0
    steps:
      - command: python3 -m pip install --user --break-system-packages -r requirements.txt || python3 -m pip install --user -r requirements.txt
      - name: Start Sample Casino
        command: python3 server.py
